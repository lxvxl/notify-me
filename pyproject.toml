[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "notify-me"
version = "1.3.0"
description = "Send personal notifications to your own devices."
readme = "README.md"
requires-python = ">=3.9"
keywords = ["notification", "push", "cli"]
classifiers = [
    "Environment :: Console",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Topic :: Utilities",
]

[project.scripts]
notify-me = "notify_me:main"

[project.optional-dependencies]
# Only needed for the `seal` / `setup` subcommands.
crypto = ["cryptography>=41"]

[tool.hatch.build.targets.wheel]
packages = ["src/notify_me"]
